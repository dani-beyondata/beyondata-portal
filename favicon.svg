<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="splitD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="50%" stop-color="white"/>
      <stop offset="50%" stop-color="#60a5fa"/>
    </linearGradient>
    <clipPath id="bg-clip">
