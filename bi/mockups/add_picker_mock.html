<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Añadir · nuevo picker (mockup)</title>
<style>
  :root{--navy:#1E3A5F;--teal:#0A4A43;--teal2:#12776b;--border:#d7dbe0;--muted:#8a929b;--ink:#1a1d24;--bg:#eef1f4;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--ink);padding:24px}
  .drawer{max-width:620px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px rgba(16,40,50,.12);overflow:hidden}
  .dhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  .dhead h2{margin:0;font-size:16px;font-weight:800;color:var(--navy)}
  .dhead .x{color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
  .dbody{padding:10px 20px 20px;max-height:72vh;overflow:auto}
  .hint{font-size:12px;color:var(--muted);margin:8px 0 4px}
  .sec{margin-top:16px}
  .sec>.lbl{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .tile{position:relative;aspect-ratio:1/1;border:1px solid var(--border);border-radius:14px;background:#fff;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;cursor:pointer;
        transition:border-color .12s,box-shadow .12s,transform .06s;padding:8px}
  .tile:hover{border-color:var(--teal2);box-shadow:0 4px 14px rgba(10,74,67,.14)}
  .tile:active{transform:translateY(1px)}
  .tile .ico{width:42px;height:42px;color:var(--navy);transition:color .12s}
  .tile:hover .ico{color:var(--teal2)}
  .tile .nm{font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.1}
  /* tooltip: limpio sin hover, aparece al pasar por encima */
  .tile[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%) translateY(4px);
        background:var(--navy);color:#fff;font-size:11px;font-weight:500;line-height:1.25;white-space:nowrap;padding:6px 9px;border-radius:7px;
        opacity:0;pointer-events:none;transition:opacity .13s,transform .13s;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .tile[data-tip]::before{content:"";position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%) translateY(4px);
        border:5px solid transparent;border-top-color:var(--navy);opacity:0;transition:opacity .13s,transform .13s;z-index:5}
  .tile[data-tip]:hover::after,.tile[data-tip]:hover::before{opacity:1;transform:translateX(-50%) translateY(0)}
  .note{max-width:620px;margin:14px auto 0;font-size:12px;color:#5b636b;text-align:center}
</style>
</head>
<body>
<div class="drawer">
  <div class="dhead"><h2>＋ Añadir al lienzo</h2><span class="x">✕</span></div>
  <div class="dbody">
    <div class="hint">Elige qué añadir. Aparecerá arriba del lienzo; luego lo arrastras. Pasa el cursor para ver qué datos espera cada uno.</div>
    <div id="sections"></div>
  </div>
</div>
<div class="note">Mockup del nuevo picker · tiles cuadrados, 4/fila, ayuda en tooltip. Clica un tile para ver qué invocaría.</div>

<script>
const I = {
  bar:'<rect x="7" y="26" width="7" height="15" rx="1.5"/><rect x="20" y="16" width="7" height="25" rx="1.5"/><rect x="33" y="9" width="7" height="32" rx="1.5"/>',
  line:'<polyline points="7,34 18,22 28,28 41,11"/><circle cx="18" cy="22" r="2.4" fill="currentColor" stroke="none"/><circle cx="28" cy="28" r="2.4" fill="currentColor" stroke="none"/><circle cx="41" cy="11" r="2.4" fill="currentColor" stroke="none"/>',
  area:'<path d="M7 34 L18 22 L28 28 L41 12 L41 41 L7 41 Z" fill="currentColor" fill-opacity="0.14"/><polyline points="7,34 18,22 28,28 41,12"/>',
  combo:'<rect x="8" y="27" width="7" height="14" rx="1.5"/><rect x="20" y="22" width="7" height="19" rx="1.5"/><rect x="32" y="17" width="7" height="24" rx="1.5"/><polyline points="8,20 23,14 35,9" stroke-dasharray="0"/>',
  donut:'<circle cx="24" cy="24" r="15"/><circle cx="24" cy="24" r="6.5"/><path d="M24 9 A15 15 0 0 1 37 31" stroke-width="4" stroke="currentColor" opacity=".5" fill="none"/>',
  pie:'<circle cx="24" cy="24" r="15"/><path d="M24 24 L24 9 A15 15 0 0 1 37.5 30 Z" fill="currentColor" fill-opacity=".18"/><line x1="24" y1="24" x2="24" y2="9"/><line x1="24" y1="24" x2="37.5" y2="30"/>',
  map:'<path d="M24 7 C16 7 11 12 11 19 C11 28 24 41 24 41 C24 41 37 28 37 19 C37 12 32 7 24 7 Z"/><circle cx="24" cy="19" r="4.5"/>',
  table:'<rect x="8" y="10" width="32" height="28" rx="2.5"/><line x1="8" y1="19" x2="40" y2="19"/><line x1="19" y1="10" x2="19" y2="38"/><line x1="8" y1="28.5" x2="40" y2="28.5"/>',
  matrix:'<rect x="8" y="10" width="32" height="28" rx="2.5"/><rect x="8" y="10" width="32" height="9" fill="currentColor" fill-opacity=".14"/><rect x="8" y="10" width="11" height="28" fill="currentColor" fill-opacity=".14"/><line x1="8" y1="19" x2="40" y2="19"/><line x1="19" y1="10" x2="19" y2="38"/><line x1="29.5" y1="10" x2="29.5" y2="38"/><line x1="8" y1="28.5" x2="40" y2="28.5"/>',
  html:'<rect x="8" y="12" width="32" height="24" rx="3"/><text x="14" y="27" font-size="11" font-weight="800" fill="currentColor" stroke="none" font-family="Segoe UI,Arial">1.2M</text><rect x="14" y="30" width="20" height="2.4" rx="1.2" fill="currentColor" stroke="none" opacity=".5"/>',
  text:'<line x1="12" y1="15" x2="36" y2="15"/><line x1="12" y1="23" x2="36" y2="23"/><line x1="12" y1="31" x2="28" y2="31"/>',
  metricgroup:'<rect x="7" y="19" width="15" height="11" rx="5.5" fill="currentColor" fill-opacity=".16"/><rect x="7" y="19" width="15" height="11" rx="5.5"/><rect x="25" y="19" width="16" height="11" rx="5.5"/>',
  resultfilter:'<path d="M9 12 L39 12 L28 25 L28 38 L20 33 L20 25 Z"/>',
  slicer:'<rect x="9" y="11" width="30" height="26" rx="3"/><rect x="13" y="16" width="4" height="4" rx="1" fill="currentColor" stroke="none"/><line x1="21" y1="18" x2="34" y2="18"/><rect x="13" y="24" width="4" height="4" rx="1" fill="currentColor" stroke="none"/><line x1="21" y1="26" x2="34" y2="26"/>',
  parameter:'<circle cx="16" cy="24" r="5"/><circle cx="33" cy="24" r="5"/><line x1="7" y1="24" x2="11" y2="24"/><line x1="21" y1="24" x2="28" y2="24"/><line x1="38" y1="24" x2="41" y2="24"/>'
};
const svg = p => `<svg class="ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const SECTIONS = [
  ["Gráficos", [["bar","Barras","k, v (+ series)"],["line","Líneas","k, v"],["area","Área","k, v"],["combo","Combo","k, series, v"],["donut","Donut","k, v"],["pie","Tarta","k, v"],["map","Mapa de países","k = país, v = valor"]]],
  ["Tabla y matriz", [["table","Tabla","columnas libres"],["matrix","Matriz","row, col, v"]]],
  ["Tarjetas / HTML", [["html","HTML","1 fila; plantilla [[col]]"],["text","Texto","HTML libre"]]],
  ["Métrica y resultado", [["metricgroup","Grupo de métrica","chips · SQL por gráfico"],["resultfilter","Filtro de resultado","recorta filas (WHERE IN)"]]],
  ["Filtros", [["slicer","Slicer","filtra la página por una columna"],["parameter","Parámetro","valor reutilizable · $param"]]]
];
document.getElementById('sections').innerHTML = SECTIONS.map(([g,items]) =>
  `<div class="sec"><div class="lbl">${g}</div><div class="grid">`+
  items.map(([t,nm,tip]) => `<div class="tile" data-tip="${tip}" onclick="pick('${t}')">${svg(I[t])}<div class="nm">${nm}</div></div>`).join("")+
  `</div></div>`).join("");
function pick(t){ const map={slicer:'addSlicer()',parameter:'addParam()'}; const call = map[t] || ("addVisual('"+t+"')"); const n=document.querySelector('.note'); n.textContent='→ '+call; n.style.color='#0A4A43'; n.style.fontWeight='700'; }
</script>
</body>
</html>
