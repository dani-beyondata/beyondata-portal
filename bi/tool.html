window.mxAxisChanged=(id)=>{ const v=CP().visuals.find(x=>x.id===id); const sel=$("e_fmtaxis"),wrap=$("axgridwrap"),grid=$("axgrid"); if(!v||!sel||!wrap)return;
  const ax=sel.value; if(ax==="off"){ wrap.style.display="none"; return; } wrap.style.display="";
  const st=MX_STATE[id]||{}; const labels=(ax==="row"?st.rowLabels:st.colLabels)||[]; const AF=v.axisFmt||{};
  grid.innerHTML = labels.length?labels.map(l=>axRowHTML(l,AF[l])).join(""):`<div class="hint">No hay etiquetas todavía. Cierra el editor, deja que la matriz se dibuje, y vuelve a abrirlo.</div>`; };
window.colsFromJSON=()=>{ const g=$("colgrid"),t=$("e_cols"); if(!g||!t)return; let o; try{o=JSON.parse(t.value.trim()||"{}");}catch(e){alert("JSON inválido: "+e.message);return;} g.innerHTML=Object.keys(o).map(k=>colRowHTML(k,o[k])).join(""); };
window.tblDetectGrid=async id=>{ const v=CP().visuals.find(x=>x.id===id); const g=$("colgrid"); if(!v||!g)return;
  try{ const rows=await q(applyRF(applyWhere(effSQL(v),null,v),v)); if(!rows.length){alert("La query no devuelve filas.");return;}
    const cols=Object.keys(rows[0]); const isNum=c=>rows.every(r=>r[c]==null||typeof r[c]==="number")&&rows.some(r=>typeof r[c]==="number");
    const have=new Set([...g.querySelectorAll(".cr-name")].map(i=>i.value.trim()));
    cols.filter(c=>isNum(c)&&!have.has(c)).forEach(c=>g.insertAdjacentHTML("beforeend",colRowHTML(c,{fmt:v.fmt||"num"}))); }catch(e){ alert("No pude detectar columnas: "+e.message); } };
function totStyleRow(label,key,s,on){ const D=key==="tot"?{bg:"#e9eff5",fg:"#1e3a5f",bd:true}:{bg:"#f3f6f8",fg:"#55606e",bd:false};
  const bold=(s.bold!=null?s.bold:true), bd=(s.border!=null?s.border:D.bd);
  return `<div class="row" style="align-items:center;gap:8px;flex-wrap:wrap">
    <label class="fxrow2" style="margin:0;width:130px"><input type="checkbox" id="ts_${key}_on" ${on?"checked":""}> ${label}</label>
    <label class="fxrow2" style="margin:0">Fondo <input type="color" id="ts_${key}_bg" value="${s.bg||D.bg}"></label>
    <label class="fxrow2" style="margin:0">Texto <input type="color" id="ts_${key}_fg" value="${s.fg||D.fg}"></label>
    <label class="fxrow2" style="margin:0"><input type="checkbox" id="ts_${key}_bold" ${bold?"checked":""}>Negrita</label>
    <label class="fxrow2" style="margin:0"><input type="checkbox" id="ts_${key}_bd" ${bd?"checked":""}>Borde</label>
  </div>`; }

function makeResizer(handleId,panelId,side){ const h=$(handleId),p=$(panelId); if(!h||!p)return;
  h.onpointerdown=ev=>{ ev.preventDefault(); h.classList.add("drag"); const sx=ev.clientX,ow=p.getBoundingClientRect().width;
    const mv=e=>{ let w=side==="right"?ow+(sx-e.clientX):ow+(e.clientX-sx); w=Math.max(380,Math.min(window.innerWidth*0.96,w)); p.style.width=w+"px"; };
    const up=()=>{ h.classList.remove("drag"); window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); try{localStorage.setItem(panelId+"_w",p.style.width);}catch(e){} };
    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); }; }

/* Motor de filtros (Postgres): puebla tableCols con las tablas base reales (sin internas),
   para que los slicers/result-filters envuelvan cada tabla en un CTE `tabla AS (SELECT * FROM public.tabla WHERE ...)`.
   FROM tabla => filtrado · FROM public.tabla => sin filtro (bypass). */
const TABLECOLS_EXCLUDE=['pipeline_entity_catalog','pipeline_events','pipeline_jobs','pipeline_runs','pms_catalog','module_required_params','profiles','client_params','companies'];
async function loadTableCols(){
  try{
    const notin=TABLECOLS_EXCLUDE.map(x=>`'${x}'`).join(",");
    const rows=await q(`select c.table_name tn, c.column_name cn from information_schema.columns c join information_schema.tables t on t.table_schema=c.table_schema and t.table_name=c.table_name where c.table_schema='public' and t.table_type='BASE TABLE' and c.table_name not in (${notin}) order by c.table_name, c.ordinal_position`);
    const tc={}; for(const r of rows){ (tc[r.tn]=tc[r.tn]||[]).push(r.cn); }
    if(Object.keys(tc).length) tableCols=tc;
  }catch(e){ console.warn("loadTableCols:", e.message); }
}

  /* Portal: sin DuckDB — q() consulta Postgres via RPC bi_run_sql (RLS del usuario). Dashboard: Supabase (compartido) → fallback localStorage → migra local a Supabase la 1ª vez. */
  // F1 · multi-report: carga la lista de reports y el report activo (fallback a bi_dashboards)
  BI_REPORTS=await loadReports();
  let _srvDoc=null; window.__landing=false;
  const _wantLanding=(new URLSearchParams(location.search).get("landing")==="1");
  if(BI_REPORTS.length){
    let rid=_wantLanding?"":biReportId();
    if(rid&&!BI_REPORTS.some(r=>r.id===rid)) rid="";
    if(!rid&&!_wantLanding){ if(BI_REPORTS.length===1) rid=BI_REPORTS[0].id; else window.__landing=true; }
    if(_wantLanding) window.__landing=true;
    if(rid){ BI_REPORT=BI_REPORTS.find(r=>r.id===rid); _srvDoc=await loadReportDoc(BI_REPORT.id); }
  }
  if(!_srvDoc){ _srvDoc=await loadDashServer(); }
  if(_srvDoc){ DASH=_srvDoc; }
  else { DASH=loadDash(); try{ const _ls=localStorage.getItem(dashKey()); if(_ls){ const _d=JSON.parse(_ls); if(_d&&_d.pages&&_d.pages.length) saveDashServer(); } }catch(e){} }
  ensureParams(); await loadTableCols(); await buildSlicerOpts();
  window.addEventListener("resize",()=>{for(const id in charts)charts[id].resize();});
  try{ const dw=localStorage.getItem("drawer_w"); if(dw)$("drawer").style.width=dw; const ew=localStorage.getItem("explorer_w"); if(ew)$("explorer").style.width=ew; }catch(e){}
  makeResizer("d_resize","drawer","right"); makeResizer("exp_resize","explorer","left");
  document.addEventListener("keydown",e=>{ const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return; if(MODE!=='edit')return; const k=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey)&&k==="z"&&!e.shiftKey){ e.preventDefault(); undo(); }
    else if((e.ctrlKey||e.metaKey)&&(k==="y"||(k==="z"&&e.shiftKey))){ e.preventDefault(); redo(); }
    else if((e.ctrlKey||e.metaKey)&&k==="a"){ e.preventDefault(); selAll(); }
    else if(k==="escape"){ selClear(); }
    else if(SEL.size&&k.indexOf("arrow")===0){ e.preventDefault(); const s=e.shiftKey?10:1; selNudge(k==="arrowleft"?-s:k==="arrowright"?s:0, k==="arrowup"?-s:k==="arrowdown"?s:0); } });
  // El tool aparece YA; los visuales se rellenan por su cuenta (cada uno con su carga/error).
  // Así el arranque no se bloquea esperando a que rendericen todas las queries en serie.
  await detectMode(); applyMode();
  seedHist(); renderReportSel(); renderTabs(); layoutStage(); paintPanel(); $("boot").style.display="none"; if(window.__landing)showLanding(); window.__ready=true; refreshAll();
}
boot().catch(e=>{ $("boot").innerHTML="<div style='color:#b4322a;max-width:520px;text-align:center'>No se pudo arrancar: "+esc(e.message)+"</div>"; window.__booterr=e.message; });
</script>
