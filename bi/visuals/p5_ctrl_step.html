<style>
#cctrl{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;color:#1a1d24;background:#fff;border-radius:12px;padding:10px 12px;box-sizing:border-box}
#cctrl table{border-collapse:collapse;width:100%}
#cctrl th{font-weight:600;color:#6d7683;text-align:right;padding:6px 8px;border-bottom:2px solid #d7dbe0;white-space:nowrap}
#cctrl th:first-child{text-align:left}
#cctrl td{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid #f0f1f3}
#cctrl td.lbl{text-align:left;color:#55606e;padding-left:20px}
#cctrl tr.ctr-ytd td.lbl{color:#1e3a5f;font-weight:600}
#cctrl tr.ctr-delta td{color:#6d7683;border-bottom:1px solid #e4e7eb}
#cctrl tr.ctsec td{background:#1e3a5f;color:#fff;font-weight:700;text-align:left;padding:6px 10px;letter-spacing:.2px;border-bottom:none}
</style>
<div id="cctrl"><table>
<thead><tr><th></th><th>Prod Total</th><th>Prod Acc</th><th>Prod Extras</th><th>ADB</th><th>Bednights</th><th>RevPab</th></tr></thead>
<tbody>[[#rows]][[&sechtml]]<tr class="ctr-[[rowcls]]"><td class="lbl">[[&lbl]]</td><td>[[&prodtot]]</td><td>[[&prodacc]]</td><td>[[&prodex]]</td><td>[[&adb]]</td><td>[[&bn]]</td><td>[[&revpab]]</td></tr>[[/rows]]</tbody>
</table></div>
